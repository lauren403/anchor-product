name: Uptime

# No schedule, deliberately.
# This monitor has never had an endpoint to check: PREVIEW_HEALTHCHECK_URL,
# BETA_HEALTHCHECK_URL and PRODUCTION_HEALTHCHECK_URL have never been set.
# It ran on a */15 cron with a three-job matrix. Actions bills per job,
# rounded up to a full minute, so this cost three billed minutes every
# quarter hour to check nothing. On 22 Aug 2026 that exhausted the
# account's Actions allowance and stopped CI on every private repo.
#
# Add a schedule back only once a URL is actually configured, and make it
# hourly. A beta with no users does not need 96 checks a day.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Health endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: preview
            url: ${{ vars.PREVIEW_HEALTHCHECK_URL }}
          - environment: beta
            url: ${{ vars.BETA_HEALTHCHECK_URL }}
          - environment: production
            url: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
    steps:
      # An environment with no endpoint configured yet is not an outage.
      #
      # This step used to be `test -n "$HEALTH_URL"`, which FAILED the job when
      # the variable was empty. No repository variables were ever set, so the
      # workflow failed every 15 minutes and had never once passed in 434 runs.
      # A monitor that is permanently red is the same as no monitor: a genuine
      # outage produces exactly the notification everyone has learned to ignore.
      #
      # Unconfigured environments are now skipped and raised as a warning, so a
      # red run means something is actually down.
      - name: Decide whether this environment is monitored
        id: target
        env:
          HEALTH_URL: ${{ matrix.url }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            variable="$(printf '%s' "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')_HEALTHCHECK_URL"
            echo "monitored=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=$ENVIRONMENT is not monitored::No health endpoint is configured. Set the $variable repository variable to turn this check on."
            echo "- **$ENVIRONMENT** - skipped, no endpoint configured" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "monitored=true" >> "$GITHUB_OUTPUT"
            echo "- **$ENVIRONMENT** - checked" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check endpoint
        if: steps.target.outputs.monitored == 'true'
        env:
          HEALTH_URL: ${{ matrix.url }}
        run: |
          response="$(curl --fail --silent --show-error --location --max-time 15 "$HEALTH_URL")"
          node -e 'const body=JSON.parse(process.argv[1]); if(body.status!=="ok"||body.service!=="anchor") process.exit(1)' "$response"
