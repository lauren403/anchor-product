name: Deploy Anchor

# Governed go-live workflow for Anchor v7 (beta or production).
#
# Deploys EXACTLY the commit named in an APPROVED release record -- not "latest main".
# This is the "approved hosting mechanism" docs/RELEASE_ENGINEERING.md left unimplemented.
# It enforces governance rather than bypassing it:
#   1. Runs inside a protected GitHub Environment (beta / production).
#   2. Requires a fully APPROVED release record (validate:release --require-approved);
#      fails closed while the record is a draft. The default record below is the pinned
#      placeholder seed, which can never be approved -- so a defaults-only run fails safe.
#   3. Checks out record.code.commit (the reviewed, approved product) and rebuilds it
#      through the full quality gate before shipping.
#   4. Sets the Sentry secret after deploy; retry-safe public health check that the live
#      release identity equals the approved commit.

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [beta, production]
      release_record:
        description: Path to the APPROVED release record (e.g. governance/releases/anchor-v7-beta-2026-08-04.json)
        required: true
        default: governance/releases/anchor-v7-beta-rc1.json
      confirmation:
        description: Type DEPLOY_ANCHOR_TO_BETA or DEPLOY_ANCHOR_TO_PRODUCTION
        required: true

permissions:
  contents: read

concurrency:
  group: anchor-deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy reviewed release
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    timeout-minutes: 40
    env:
      WORKER_NAME: anchor-${{ inputs.target_environment }}
    steps:
      - name: Enforce deploy boundary
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TARGET: ${{ inputs.target_environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        shell: bash
        run: |
          set -euo pipefail
          expected="DEPLOY_ANCHOR_TO_$(printf '%s' "$TARGET" | tr '[:lower:]' '[:upper:]')"
          test "$CONFIRMATION" = "$expected"
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SENTRY_DSN SENTRY_DSN; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Require an approved release record and resolve the target commit
        id: record
        env:
          RECORD: ${{ inputs.release_record }}
          TARGET: ${{ inputs.target_environment }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RECORD" || { echo "::error::Release record not found: $RECORD"; exit 1; }
          npm run validate:release -- "$RECORD" --require-approved
          target_commit="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).code.commit)' "$RECORD")"
          node scripts/verify-release-target.mjs "$RECORD" "$TARGET" "$target_commit"
          echo "target_commit=$target_commit" >> "$GITHUB_OUTPUT"

      - name: Check out the approved commit
        env:
          TARGET_COMMIT: ${{ steps.record.outputs.target_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force "$TARGET_COMMIT"
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          git diff --exit-code

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate environment configuration
        # Run #1 failed here reporting NEXT_PUBLIC_SENTRY_DSN and SENTRY_DSN missing, while
        # "Enforce deploy boundary" above had just proved all four secrets were present. This
        # step had no env block, so validate-config.mjs read an empty environment and could
        # never pass for beta or production, whatever was configured. Same shape as the step
        # below, which has always had one.
        env:
          NEXT_PUBLIC_RELEASE_SHA: ${{ steps.record.outputs.target_commit }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: npm run validate:config -- --environment "${{ inputs.target_environment }}"

      - name: Validate, test and build the approved release
        env:
          NEXT_PUBLIC_ANCHOR_ENV: ${{ inputs.target_environment }}
          NEXT_PUBLIC_RELEASE_SHA: ${{ steps.record.outputs.target_commit }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Verify no source maps in public artifact
        shell: bash
        run: |
          set -euo pipefail
          if find dist/client -type f -name '*.map' -print -quit | grep -q .; then
            echo "::error::Source maps remain in the public deploy artifact."
            exit 1
          fi

      - name: Deploy worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          command: >-
            deploy --config wrangler.production.jsonc
            --name ${{ env.WORKER_NAME }}
            --var NEXT_PUBLIC_ANCHOR_ENV:${{ inputs.target_environment }}
            --var NEXT_PUBLIC_RELEASE_SHA:${{ steps.record.outputs.target_commit }}
            --message "Anchor ${{ inputs.target_environment }} ${{ steps.record.outputs.target_commit }}"

      - name: Set runtime secrets (after deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/anchor-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({SENTRY_DSN:process.env.SENTRY_DSN}), {mode:0o600})' "$secrets_file"
          ./node_modules/.bin/wrangler secret bulk "$secrets_file" --config wrangler.production.jsonc --name "$WORKER_NAME"

      - name: Public health check
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          TARGET: ${{ inputs.target_environment }}
          TARGET_COMMIT: ${{ steps.record.outputs.target_commit }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          echo "Deployed to: $DEPLOYMENT_URL"
          healthy=false
          for attempt in $(seq 1 12); do
            if response="$(curl --fail --silent --show-error --location --max-time 20 "${DEPLOYMENT_URL%/}/api/health")"; then
              if node -e 'const b=JSON.parse(process.argv[1]); if(b.status!=="ok"||b.service!=="anchor"||b.environment!==process.argv[2]||b.release!==process.argv[3])process.exit(1)' "$response" "$TARGET" "$TARGET_COMMIT"; then
                healthy=true
                break
              fi
            fi
            sleep 5
          done
          test "$healthy" = "true" || { echo "::error::Deployed health contract did not converge."; exit 1; }

      - name: Verify the deployed page actually loads its assets
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        # The logic lives in scripts/deployed-asset-check.mjs, not inline here, so that
        # tests/deployed-asset-check.test.mjs can prove it FAILS on the exact deploy that
        # shipped on 2026-08-23: page renders, /api/health perfect, every asset 503. A
        # gate nobody has watched fail is a gate nobody should trust.
        run: node scripts/deployed-asset-check.mjs
