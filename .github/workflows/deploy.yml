name: Deploy Anchor

# Governed go-live workflow for Anchor v7 (beta or production).
#
# This is the "approved hosting mechanism" that docs/RELEASE_ENGINEERING.md
# intentionally left unimplemented. It does NOT bypass governance — it enforces it:
#   1. Runs inside a protected GitHub Environment (beta / production) that must
#      have a REQUIRED REVIEWER. The deploy pauses for that approver.
#   2. Refuses to deploy unless a fully APPROVED release record for this exact
#      commit + environment exists (validate:release --require-approved). While
#      the record is a draft, this workflow CANNOT deploy anything — fail closed.
#   3. Rebuilds and re-runs the full quality gate before shipping.
#
# Until the beta/production environments are created with reviewers AND an
# approved release record exists, dispatching this workflow safely fails.

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [beta, production]
      release_record:
        description: Path to the APPROVED JSON release record
        required: true
        default: governance/releases/anchor-v7-beta-rc1.json
      confirmation:
        description: Type DEPLOY_ANCHOR_TO_BETA or DEPLOY_ANCHOR_TO_PRODUCTION
        required: true

permissions:
  contents: read

concurrency:
  group: anchor-deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy reviewed release
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    timeout-minutes: 40
    env:
      RELEASE_SHA: ${{ github.sha }}
      WORKER_NAME: anchor-${{ inputs.target_environment }}
    steps:
      - name: Enforce deploy boundary
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TARGET: ${{ inputs.target_environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        shell: bash
        run: |
          set -euo pipefail
          expected="DEPLOY_ANCHOR_TO_$(printf '%s' "$TARGET" | tr '[:lower:]' '[:upper:]')"
          test "$CONFIRMATION" = "$expected"
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SENTRY_DSN SENTRY_DSN; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify reviewed source lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate environment configuration
        run: npm run validate:config -- --environment "${{ inputs.target_environment }}"

      - name: Require an approved release record for this commit + environment
        env:
          RECORD: ${{ inputs.release_record }}
          TARGET: ${{ inputs.target_environment }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:release -- "$RECORD" --require-approved
          node scripts/verify-release-target.mjs "$RECORD" "$TARGET" "$COMMIT"

      - name: Validate, test and build reviewed release
        env:
          NEXT_PUBLIC_ANCHOR_ENV: ${{ inputs.target_environment }}
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Verify no source maps in public artifact
        shell: bash
        run: |
          set -euo pipefail
          if find dist/client -type f -name '*.map' -print -quit | grep -q .; then
            echo "::error::Source maps remain in the public deploy artifact."
            exit 1
          fi

      - name: Deploy worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          command: >-
            deploy --config wrangler.production.jsonc
            --name ${{ env.WORKER_NAME }}
            --var NEXT_PUBLIC_ANCHOR_ENV:${{ inputs.target_environment }}
            --var NEXT_PUBLIC_RELEASE_SHA:${{ github.sha }}
            --message "Anchor ${{ inputs.target_environment }} ${{ github.sha }}"

      - name: Set runtime secrets (after deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/anchor-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({SENTRY_DSN:process.env.SENTRY_DSN}), {mode:0o600})' "$secrets_file"
          ./node_modules/.bin/wrangler secret bulk "$secrets_file" --config wrangler.production.jsonc --name "$WORKER_NAME"

      - name: Public health check
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          TARGET: ${{ inputs.target_environment }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          echo "Deployed to: $DEPLOYMENT_URL"
          healthy=false
          for attempt in $(seq 1 12); do
            if response="$(curl --fail --silent --show-error --location --max-time 20 "${DEPLOYMENT_URL%/}/api/health")"; then
              if node -e 'const b=JSON.parse(process.argv[1]); if(b.status!=="ok"||b.service!=="anchor"||b.environment!==process.argv[2]||b.release!==process.argv[3])process.exit(1)' "$response" "$TARGET" "$RELEASE_SHA"; then
                healthy=true
                break
              fi
            fi
            sleep 5
          done
          test "$healthy" = "true" || { echo "::error::Deployed health contract did not converge."; exit 1; }
