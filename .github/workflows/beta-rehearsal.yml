name: Deploy beta rehearsal

# Throwaway, password-gated rehearsal of the Anchor v7 cutover.
#
# Deploys the built v7 app fronted by an HTTP Basic password gate (beta/worker.ts)
# to a workers.dev URL named `anchor-beta-rehearsal`. This is NOT the live site
# and NOT the production deploy path (that is deploy.yml, which serves ungated at
# the real hostname). It exists only to rehearse build -> deploy -> migration ->
# service-worker takeover with nothing at stake.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_ANCHOR_BETA_REHEARSAL
        required: true

permissions:
  contents: read

concurrency:
  group: anchor-beta-rehearsal
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy password-gated rehearsal beta
    runs-on: ubuntu-latest
    environment: beta
    timeout-minutes: 40
    steps:
      - name: Enforce confirmation and required secrets
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANCHOR_BETA_PASSWORD: ${{ secrets.ANCHOR_BETA_PASSWORD }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DEPLOY_ANCHOR_BETA_REHEARSAL"
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANCHOR_BETA_PASSWORD; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done
          test "${#ANCHOR_BETA_PASSWORD}" -ge 8 || { echo "::error::ANCHOR_BETA_PASSWORD must be at least 8 characters"; exit 1; }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build the verified app artifact
        env:
          NEXT_PUBLIC_ANCHOR_ENV: beta
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run build

      - name: Deploy gated rehearsal worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          command: deploy --config wrangler.beta.jsonc

      - name: Set gate and runtime secrets (after deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANCHOR_BETA_PASSWORD: ${{ secrets.ANCHOR_BETA_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/anchor-beta-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({ANCHOR_BETA_PASSWORD:process.env.ANCHOR_BETA_PASSWORD, SENTRY_DSN:process.env.SENTRY_DSN}), {mode:0o600})' "$secrets_file"
          ./node_modules/.bin/wrangler secret bulk "$secrets_file" --config wrangler.beta.jsonc

      - name: Verify the password gate
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ANCHOR_BETA_PASSWORD: ${{ secrets.ANCHOR_BETA_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          echo "Rehearsal beta deployed to: $DEPLOYMENT_URL"
          base="${DEPLOYMENT_URL%/}"
          # Gate must block an unauthenticated request...
          unauth=""
          for attempt in $(seq 1 10); do
            unauth="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base/")" || unauth=""
            [ "$unauth" = "401" ] && break
            sleep 5
          done
          test "$unauth" = "401" || { echo "::error::Gate did not block unauthenticated request (got '$unauth')"; exit 1; }
          # ...and allow the correct password.
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -u "beta:${ANCHOR_BETA_PASSWORD}" "$base/")"
          test "$code" = "200" || { echo "::error::Authenticated request failed (got '$code')"; exit 1; }
          echo "Gate verified: 401 without password, 200 with. Password-protected beta is live at $DEPLOYMENT_URL"
