name: Cloudflare acceptance deployment


on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_SYNTHETIC_SMOKE_ONLY
        required: true


permissions:
  contents: read


concurrency:
  group: anchor-cloudflare-private-smoke
  cancel-in-progress: false


jobs:
  deploy:
    name: Deploy and verify isolated Anchor smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: preview
    env:
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_NAME: anchor@${{ github.sha }}
      WORKER_NAME: anchor-private-smoke
    steps:
      - name: Enforce acceptance boundary
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DEPLOY_SYNTHETIC_SMOKE_ONLY"
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SENTRY_DSN SENTRY_DSN SENTRY_ORG SENTRY_PROJECT SENTRY_AUTH_TOKEN; do
            test -n "${!name}" || { echo "::error::Missing required GitHub secret: $name"; exit 1; }
          done

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0


      - name: Verify reviewed source lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor 50323c8633dde9b5000faff2f940fa9d2aa97518 "$RELEASE_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm


      - name: Install locked dependencies
        run: npm ci --ignore-scripts


      - name: Generate binding types
        shell: bash
        run: |
          set -euo pipefail
          temporary_vars="$(mktemp)"
          trap 'rm -f "$temporary_vars"' EXIT
          printf '%s\n' 'SENTRY_DSN="https://public@example.ingest.sentry.io/1"' 'ANCHOR_SMOKE_TOKEN="type-generation-placeholder"' > "$temporary_vars"
          ./node_modules/.bin/wrangler types smoke/worker-configuration.d.ts --config wrangler.smoke.jsonc --include-runtime=false --env-file "$temporary_vars"
          sed -E -i 's# --env-file=[^ ]+##' smoke/worker-configuration.d.ts
          git diff --exit-code -- smoke/worker-configuration.d.ts

      - name: Validate, test and build reviewed release
        env:
          NEXT_PUBLIC_ANCHOR_ENV: preview
          # Build-time twin of the deploy-time --var flag. Wrangler sets the Worker
          # var at deploy, which does not reach process.env in this build, so the
          # acceptance endpoint gated on it always 404d. This is inlined at build,
          # the same way NEXT_PUBLIC_ANCHOR_ENV above already works. Only ever set
          # in this isolated acceptance job - never in beta or production builds.
          NEXT_PUBLIC_ANCHOR_SMOKE_ACCEPTANCE_ENABLED: "true"
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          npm run validate:config -- --environment preview
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run build
          npm run test:rendered
          npm audit --omit=dev --audit-level=high
          npm run test:rollback

      - name: Verify private source-map handling
        shell: bash
        run: |
          set -euo pipefail
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "::error::Source maps remain in the public deploy artifact."
            exit 1
          fi

      - name: Validate Cloudflare package without deploying
        run: ./node_modules/.bin/wrangler deploy --dry-run --config wrangler.smoke.jsonc


      - name: Register isolated workers.dev subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/cloudflare-subdomain-response.json"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --request PUT             --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             --header "Content-Type: application/json"             --data '{"subdomain":"mobmind-anchor"}'             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          if test "$http_status" = "409"; then
            http_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}'               --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          fi
          test "$http_status" = "200" || { echo "::error::Cloudflare rejected workers.dev subdomain registration (HTTP $http_status)."; exit 1; }
          node - "$response_file" <<'NODE'
          const response = require(process.argv[2]);
          if (response.success !== true || response.result?.subdomain !== "mobmind-anchor") {
            throw new Error("Cloudflare did not confirm the approved workers.dev subdomain.");
          }
          NODE

      - name: Generate temporary acceptance credentials
        id: acceptance
        shell: bash
        run: |
          set -euo pipefail
          access_token="$(openssl rand -hex 32)"
          sentinel="anchor-smoke-$(openssl rand -hex 16)"
          echo "::add-mask::$access_token"
          echo "::add-mask::$sentinel"
          echo "access_token=$access_token" >> "$GITHUB_OUTPUT"
          echo "sentinel=$sentinel" >> "$GITHUB_OUTPUT"

      - name: Deploy reviewed release behind temporary gate
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          command: deploy --config wrangler.smoke.jsonc --name anchor-private-smoke --var ANCHOR_SMOKE_ACCEPTANCE_ENABLED:true --var NEXT_PUBLIC_ANCHOR_ENV:preview --var NEXT_PUBLIC_RELEASE_SHA:${{ github.sha }} --tag candidate-${{ github.run_id }} --message "Anchor isolated acceptance ${{ github.sha }}"


      - name: Upload temporary acceptance secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ANCHOR_SMOKE_TOKEN: ${{ steps.acceptance.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/anchor-smoke-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({SENTRY_DSN:process.env.SENTRY_DSN,ANCHOR_SMOKE_TOKEN:process.env.ANCHOR_SMOKE_TOKEN}), {mode:0o600})' "$secrets_file"
          ./node_modules/.bin/wrangler secret bulk "$secrets_file" --config wrangler.smoke.jsonc --name "$WORKER_NAME"

      - name: Verify access gate and health contract
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ACCESS_TOKEN: ${{ steps.acceptance.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          unauthorised_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "${DEPLOYMENT_URL%/}/api/health")"
          test "$unauthorised_status" = "404"
          health_matched=false
          for attempt in $(seq 1 12); do
            response="$(curl --fail --silent --show-error --location --max-time 20 --header "Authorization: Bearer $ACCESS_TOKEN" "${DEPLOYMENT_URL%/}/api/health")" || true
            if node - "$response" "$RELEASE_SHA" <<'NODE'
          const [bodyText, expectedRelease] = process.argv.slice(2);
          const body = JSON.parse(bodyText);
          if (body.status !== "ok" || body.service !== "anchor" || body.environment !== "preview" || body.release !== expectedRelease) {
            process.exit(1);
          }
          NODE
            then
              health_matched=true
              break
            fi
            sleep 5
          done
          test "$health_matched" = "true" || { echo "::error::Deployed health contract did not converge to the reviewed release."; exit 1; }

      - name: Trigger one privacy-scrubbed synthetic event
        id: synthetic
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ACCESS_TOKEN: ${{ steps.acceptance.outputs.access_token }}
          SENTINEL: ${{ steps.acceptance.outputs.sentinel }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --request POST --max-time 20 --header "Authorization: Bearer $ACCESS_TOKEN" --header "X-Anchor-Synthetic-Sentinel: $SENTINEL" "${DEPLOYMENT_URL%/}/api/_acceptance/sentry")"
          event_id="$(node -e 'const body=JSON.parse(process.argv[1]); if(body.status!=="accepted" || !/^[a-f0-9]{32}$/.test(body.eventId)) process.exit(1); process.stdout.write(body.eventId)' "$response")"
          echo "event_id=$event_id" >> "$GITHUB_OUTPUT"

      - name: Inspect received Sentry event and source maps
        env:
          EVENT_ID: ${{ steps.synthetic.outputs.event_id }}
          SENTINEL: ${{ steps.acceptance.outputs.sentinel }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          event_file="$RUNNER_TEMP/sentry-event.json"
          attachments_file="$RUNNER_TEMP/sentry-attachments.json"
          release_files="$RUNNER_TEMP/sentry-release-files.json"
          release_path="$(node -p 'encodeURIComponent(process.argv[1])' "$RELEASE_NAME")"
          auth_header="Authorization: Bearer $SENTRY_AUTH_TOKEN"

          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --output "$event_file" --header "$auth_header" "https://sentry.io/api/0/projects/$SENTRY_ORG/$SENTRY_PROJECT/events/$EVENT_ID/"; then
              break
            fi
            sleep 5
          done
          test -s "$event_file"
          curl --fail --silent --show-error --output "$attachments_file" --header "$auth_header" "https://sentry.io/api/0/projects/$SENTRY_ORG/$SENTRY_PROJECT/events/$EVENT_ID/attachments/"
          curl --fail --silent --show-error --output "$release_files" --header "$auth_header" "https://sentry.io/api/0/projects/$SENTRY_ORG/$SENTRY_PROJECT/releases/$release_path/files/"
          node scripts/verify-sentry-acceptance.mjs "$event_file" "$attachments_file" "$release_files" "$EVENT_ID" "$SENTINEL" "$RELEASE_NAME" sentry-acceptance-evidence.json
          rm -f "$event_file" "$attachments_file" "$release_files"

      - name: Perform provider rollback drill
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ACCESS_TOKEN: ${{ steps.acceptance.outputs.access_token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ANCHOR_SMOKE_TOKEN: ${{ steps.acceptance.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          versions_before="cloudflare-versions-before-drill.json"
          versions_after="cloudflare-versions-after-drill.json"
          secrets_file="$RUNNER_TEMP/anchor-smoke-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({SENTRY_DSN:process.env.SENTRY_DSN,ANCHOR_SMOKE_TOKEN:process.env.ANCHOR_SMOKE_TOKEN}), {mode:0o600})' "$secrets_file"

          ./node_modules/.bin/wrangler versions list --name "$WORKER_NAME" --json > "$versions_before"
          candidate_version="$(node -e 'const d=require("./"+process.argv[1]); const a=Array.isArray(d)?d:(d.items??d.versions??[]); if(!a[0]?.id)process.exit(1); process.stdout.write(a[0].id)' "$versions_before")"
          ./node_modules/.bin/wrangler versions upload --config wrangler.smoke.jsonc --tag rollback-drill-${{ github.run_id }} --message "Rollback drill intermediate" --var "ROLLBACK_DRILL_MARKER:${{ github.run_id }}" --secrets-file "$secrets_file"
          ./node_modules/.bin/wrangler versions list --name "$WORKER_NAME" --json > "$versions_after"
          drill_version="$(node -e 'const d=require("./"+process.argv[1]); const a=Array.isArray(d)?d:(d.items??d.versions??[]); if(!a[0]?.id)process.exit(1); process.stdout.write(a[0].id)' "$versions_after")"
          test "$drill_version" != "$candidate_version"
          ./node_modules/.bin/wrangler versions deploy "$drill_version@100%" --name "$WORKER_NAME" --message "Anchor rollback drill intermediate" --yes
          curl --fail --silent --show-error --max-time 20 --header "Authorization: Bearer $ACCESS_TOKEN" "${DEPLOYMENT_URL%/}/api/health" > /dev/null
          ./node_modules/.bin/wrangler rollback "$candidate_version" --name "$WORKER_NAME" --message "Anchor acceptance rollback proof" --yes
          response="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 20 --header "Authorization: Bearer $ACCESS_TOKEN" "${DEPLOYMENT_URL%/}/api/health")"
          node -e 'const body=JSON.parse(process.argv[1]); if(body.status!=="ok" || body.release!==process.argv[2]) process.exit(1)' "$response" "$RELEASE_SHA"
          node - "$candidate_version" "$drill_version" <<'NODE'
          const [candidateVersion, drillVersion] = process.argv.slice(2);
          const evidence = { schemaVersion: 1, checkedAt: new Date().toISOString(), candidateVersion, drillVersion, rollbackRestoredCandidate: true, healthAfterRollback: true };
          require("node:fs").writeFileSync("cloudflare-rollback-evidence.json", JSON.stringify(evidence, null, 2) + "\n", { mode: 0o600 });
          NODE

      - name: Upload redacted acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: anchor-cloudflare-acceptance-${{ github.sha }}
          path: |
            sentry-acceptance-evidence.json
            cloudflare-rollback-evidence.json
            cloudflare-versions-before-drill.json
            cloudflare-versions-after-drill.json
          if-no-files-found: error
          retention-days: 30