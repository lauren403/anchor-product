name: CodeQL

on:
  pull_request:
  push:
    branches: [main, beta]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  analyse:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          # This private personal repository does not have GitHub code-scanning
          # upload enabled. CodeQL still builds the database and runs all queries;
          # disabling only SARIF upload prevents a plan-level API error.
          upload: never
