name: CodeQL

on:
  pull_request:
  push:
    branches: [main, beta]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: read

jobs:
  analyse:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          # This is a private repository on a PERSONAL account, and GitHub gates
          # code scanning for private repos behind Advanced Security, which is
          # Organizations-only. The repository Security page states this outright:
          # "Code scanning alerts - Disabled. Advanced Security is only available
          # for Organizations." So SARIF upload is impossible here, not merely
          # switched off, and leaving it on produced a run-level error plus eight
          # warnings while the action retried the upload four times.
          #
          # WHY `output` MATTERS: with `upload: never` alone, CodeQL built the
          # database, ran every query, and then DISCARDED the results. The job went
          # green regardless of what it found, and nobody could ever read the
          # findings. A green run meant "the analysis completed", NOT "nothing was
          # found" - and the release record was citing it as though it meant the
          # latter. Writing SARIF to a directory and publishing it as a build
          # artifact makes the findings retrievable without Advanced Security.
          upload: never
          output: codeql-results

      # Surface the finding count on the run page itself, so the result is visible
      # without downloading and reading SARIF by hand.
      - name: Summarise CodeQL findings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          total=0
          shopt -s nullglob
          for file in codeql-results/*.sarif; do
            count="$(node -e 'const r=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String((r.runs||[]).reduce((n,run)=>n+((run.results||[]).length),0)))' "$file")"
            echo "$file: $count result(s)"
            total=$(( total + count ))
          done
          echo "CodeQL total findings: $total"
          {
            echo "### CodeQL"
            echo
            echo "**$total finding(s)** across the JavaScript/TypeScript query suite."
            echo
            echo "Full SARIF is attached to this run as the \`codeql-sarif-${GITHUB_SHA}\` artifact."
            echo "Code scanning alerts are unavailable on this plan, so the artifact is the only"
            echo "place these results exist. A green run does not by itself mean zero findings."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish SARIF as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ github.sha }}
          path: codeql-results
          if-no-files-found: error
          retention-days: 30
